<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pherotrio · c2 · câmaras em cúpula</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15110E;font-family:system-ui,sans-serif;color:#EFE7DC;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;height:56px;background:#211B17;border-bottom:1px solid #5A4B3F;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box;font-size:13px;gap:8px}
#top button{min-height:40px;background:#15110E;color:#EFE7DC;border:1px solid #5A4B3F;border-radius:8px;font-size:13px;padding:0 10px}
#top button.on{border-color:#EFE7DC;background:#2B231D}
#bot{position:fixed;left:0;right:0;bottom:0;height:112px;background:#211B17;border-top:1px solid #5A4B3F;box-sizing:border-box;padding:8px 12px;font-size:12px;color:#B3A697}
#lod{color:#EFE7DC;font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btns{display:flex;gap:6px}
#btns button{flex:1;min-height:44px;background:#15110E;color:#EFE7DC;border:1px solid #5A4B3F;border-radius:8px;font-size:13px;padding:0 4px}
#hint{margin-top:5px;line-height:1.25;font-size:11px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><b>Câmaras · D101 a D105</b><button id="labels" class="on">Rótulos</button></div>
<div id="bot">
  <div id="lod"></div>
  <div id="btns"><button id="zout">− zoom</button><button id="all">Ver tudo</button><button id="zin">+ zoom</button></div>
  <div id="hint">Toque numa câmara para trocar o estado. Pinça para zoom, arraste para mover.</div>
</div>
<script>
const MW = 18, MH = 18, SKY = 3, Z_MAX = 72, TOP = 56, BOT = 112, INTEN = 0.4;
const C = { solo: '#15110E', base: '#43362B', txt: '#EFE7DC', txt2: '#B3A697', veg: '#7FD16B', acu: '#F5B841', ani: '#F06E9A', min: '#BFA88A', ref: '#857A6E', def: '#6FB3E8', atk: '#9A6BFF', perigo: '#FF4F5E', ceu: '#1C2530', painel: '#211B17' };
const T1 = 0.25, T2 = 0.34, ANT = 0.36 / 14 * 0.8, ITEM = 0.27;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let VW, VH, DPR, showLabels = true;
function resize() { VW = innerWidth; VH = innerHeight; DPR = devicePixelRatio || 1; cv.width = VW * DPR; cv.height = VH * DPR; cv.style.width = VW + 'px'; cv.style.height = VH + 'px'; clampCam(); }
const useH = () => VH - TOP - BOT;
const zMin = () => Math.min(Math.min(VW / MW, useH() / (MH + SKY)) * 0.98, 9);
const ux = () => VW / 2, uy = () => TOP + useH() / 2;
const cam = { x: 9, y: 7, z: 26, anim: null };
function clampCam() {
  if (!VW) return;
  cam.z = Math.max(zMin(), Math.min(Z_MAX, cam.z));
  const hw = VW / 2 / cam.z, hh = useH() / 2 / cam.z;
  cam.x = hw * 2 >= MW ? MW / 2 : Math.max(hw, Math.min(MW - hw, cam.x));
  cam.y = hh * 2 >= MH + SKY ? (MH - SKY) / 2 : Math.max(-SKY + hh, Math.min(MH - hh, cam.y));
}
const w2s = (x, y) => ({ x: (x - cam.x) * cam.z + ux(), y: (y - cam.y) * cam.z + uy() });
const s2w = (x, y) => ({ x: (x - ux()) / cam.z + cam.x, y: (y - uy()) / cam.z + cam.y });
const lodOf = z => z >= 36 ? 'perto' : z >= 18 ? 'medio' : z >= 12 ? 'longe' : 'geral';
const LOD_NOME = { perto: 'Perto', medio: 'Médio', longe: 'Longe', geral: 'Visão geral' };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function lerpCol(a, b, k) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }
function curve(a, b, bend) {
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y, c = { x: mx - dy * bend, y: my + dx * bend };
  const pts = []; for (let i = 0; i <= 12; i++) { const t = i / 12, u = 1 - t; pts.push({ x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }); }
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  return { pts, cum, len: cum[cum.length - 1] };
}
function at(p, s) {
  s = Math.max(0, Math.min(p.len, s)); let i = 1; while (i < p.cum.length - 1 && p.cum[i] < s) i++;
  const a = p.pts[i - 1], b = p.pts[i], seg = (p.cum[i] - p.cum[i - 1]) || 1, t = (s - p.cum[i - 1]) / seg;
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
const pulseK = (hz, amp) => amp * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(T * 6.2832 * hz)));

// ---------- recursos (07 §11) ----------
const RES = {
  folha: { f: 'losango', c: [C.veg] }, seiva: { f: 'gota', c: [C.acu] }, presa: { f: 'tri', c: [C.ani] }, argila: { f: 'quad', c: [C.min] },
  fungo: { f: 'circ', c: [C.veg] }, nectar: { f: 'hex', c: [C.acu] }, proteina: { f: 'caps', c: [C.ani] }, quitina: { f: 'pent', c: [C.ani] },
  barro: { f: 'ret', c: [C.min] }, acido: { f: 'triInv', c: [C.acu, C.ani] }, refugo: { f: 'cruz', c: [C.ref] }, ovo: { f: 'ovo', c: [C.txt] },
};
function shapePath(f, x, y, s) {
  const r = s / 2; ctx.beginPath();
  const poly = (n, rot, rr = r) => { for (let i = 0; i < n; i++) { const a = rot + i / n * 6.2832; i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); };
  if (f === 'losango') { ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.75, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.75, y); ctx.closePath(); }
  else if (f === 'gota') { ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x + r * 0.95, y + r * 0.1, x + r * 0.62, y + r * 0.55); ctx.arc(x, y + r * 0.3, r * 0.68, 0.38, Math.PI - 0.38); ctx.quadraticCurveTo(x - r * 0.95, y + r * 0.1, x, y - r); ctx.closePath(); }
  else if (f === 'tri') poly(3, -Math.PI / 2);
  else if (f === 'triInv') poly(3, Math.PI / 2);
  else if (f === 'quad') ctx.rect(x - r * 0.8, y - r * 0.8, r * 1.6, r * 1.6);
  else if (f === 'circ') ctx.arc(x, y, r * 0.88, 0, 6.2832);
  else if (f === 'hex') poly(6, 0);
  else if (f === 'pent') poly(5, -Math.PI / 2);
  else if (f === 'ret') ctx.rect(x - r, y - r * 0.5, r * 2, r);
  else if (f === 'caps') { const h = r * 0.55; ctx.moveTo(x - r + h, y - h); ctx.lineTo(x + r - h, y - h); ctx.arc(x + r - h, y, h, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x - r + h, y + h); ctx.arc(x - r + h, y, h, Math.PI / 2, Math.PI * 1.5); ctx.closePath(); }
  else if (f === 'cruz') { const w = r * 0.38; ctx.rect(x - r * 0.8, y - w, r * 1.6, w * 2); ctx.rect(x - w, y - r * 0.8, w * 2, r * 1.6); }
  else if (f === 'ovo') ctx.ellipse(x, y, r * 0.55, r * 0.75, 0, 0, 6.2832);
}
function item(kind, x, y, s, gray) {
  const d = RES[kind]; shapePath(d.f, x, y, s);
  if (gray) { ctx.fillStyle = '#857A6E'; ctx.fill(); return; }
  if (d.c.length === 1) { ctx.fillStyle = d.c[0]; ctx.fill(); return; }
  ctx.save(); ctx.clip(); ctx.fillStyle = d.c[0]; ctx.fillRect(x - s, y - s, s, s * 2); ctx.fillStyle = d.c[1]; ctx.fillRect(x, y - s, s, s * 2); ctx.restore();
}

// ---------- formigas ----------
function ant(x, y, ang, lod, z, col, opt = {}) {
  const sc = ANT * (opt.scale || 1);
  if (lod === 'longe' || lod === 'geral') { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, Math.max(1.1 / z, 0.06 * (opt.scale || 1)), 0, 6.2832); ctx.fill(); return; }
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(sc, sc);
  if (opt.dashed) { ctx.strokeStyle = C.txt2; ctx.lineWidth = 0.7; ctx.setLineDash([1.2, 1.2]); }
  else ctx.fillStyle = col;
  const head = opt.bigHead ? 2.4 : 1.7;
  const parts = [[-4.2, 0, 3.6, 2.6], [1.6, 0, 1.9, 1.3], [4.6, 0, head + 0.2, head]];
  parts.forEach(([px, py, rx, ry]) => { ctx.beginPath(); ctx.ellipse(px, py, rx, ry, 0, 0, 6.2832); opt.dashed ? ctx.stroke() : ctx.fill(); });
  if (!opt.dashed) { ctx.beginPath(); ctx.arc(-0.4, 0, 0.8, 0, 6.2832); ctx.fill(); }
  if (lod === 'perto' && !opt.dashed) { ctx.strokeStyle = col; ctx.lineWidth = 0.7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(5.8, -0.8); ctx.quadraticCurveTo(7.2, -3, 8.8, -2.8 + (opt.nod || 0)); ctx.moveTo(5.8, 0.8); ctx.quadraticCurveTo(7.2, 3, 8.8, 2.8 + (opt.nod || 0)); ctx.stroke(); }
  ctx.setLineDash([]); ctx.restore();
  if (opt.carry && lod !== 'longe') item(opt.carry, x + Math.cos(ang) * 0.1, y - 0.13, 0.17);
}

// ---------- câmaras ----------
// tam: P 2x1, M 3x1, G 3x2 (D105). porta: lado por onde o túnel entra (D101)
const CH = [
  { id: 'jardim', nome: 'Jardim de fungo · nv2', tam: 'M', x: 1.0, y: 4, porta: 'R', cat: 'prod', fam: [C.veg], ins: ['folha'], out: 'fungo', vagas: 3, nivel: 2, estado: 'produzindo' },
  { id: 'destilaria', nome: 'Destilaria', tam: 'M', x: 14.0, y: 4, porta: 'L', cat: 'prod', fam: [C.acu], ins: ['seiva'], out: 'nectar', vagas: 1, estado: 'falta_ing' },
  { id: 'acida', nome: 'Câmara ácida', tam: 'M', x: 1.6, y: 8, porta: 'R', cat: 'prod', fam: [C.acu, C.ani], ins: ['nectar', 'proteina'], out: 'acido', vagas: 2, estado: 'falta_cuid' },
  { id: 'presas', nome: 'Câmara de presas', tam: 'M', x: 13.4, y: 8, porta: 'L', cat: 'prod', fam: [C.ani], ins: ['presa'], out: 'proteina', out2: 'quitina', vagas: 1, estado: 'saida_cheia' },
  { id: 'real', nome: 'Câmara real', tam: 'G', x: 10.4, y: 11, porta: 'L', cat: 'base', fam: [], ins: ['fungo'], out: 'ovo', vagas: 0, estado: 'produzindo' },
  { id: 'bercario', nome: 'Berçário · dieta fungo', tam: 'G', x: 4.6, y: 11, porta: 'R', cat: 'base', fam: [], ins: ['fungo'], vagas: 2, estado: 'produzindo' },
  { id: 'deposito', nome: 'Depósito', tam: 'G', x: 7.5, y: 15.2, porta: 'T', cat: 'base', fam: [], estado: 'normal' },
  { id: 'lixeira', nome: 'Lixeira', tam: 'M', x: 1.2, y: 14.2, porta: 'T', cat: 'base', fam: [], estado: 'normal' },
  { id: 'posto', nome: 'Posto de guarda', tam: 'P', x: 10.3, y: 1.4, porta: 'L', cat: 'def', fam: [C.def], vagas: 4, estado: 'ataque' },
  { id: 'coletor', nome: 'Coletor de seiva', tam: 'P', x: 14.8, y: 13.6, porta: 'L', cat: 'ext', fam: [C.acu], out: 'seiva', vagas: 2, estado: 'produzindo' },
];
const DIM = { P: [2, 1], M: [3, 1], G: [3, 2] };
const ESTADOS = {
  prod: ['produzindo', 'falta_ing', 'falta_cuid', 'saida_cheia', 'pausada', 'ataque', 'vazia'],
  base: ['produzindo', 'falta_ing', 'pausada', 'ataque'],
  armazem: ['normal', 'cheio', 'ataque'],
  def: ['normal', 'falta_cuid', 'ataque'],
  ext: ['produzindo', 'falta_cuid', 'saida_cheia', 'ataque'],
};
const NOME_ESTADO = { produzindo: 'produzindo', falta_ing: 'falta ingrediente', falta_cuid: 'falta cuidadora', saida_cheia: 'saída cheia', pausada: 'pausada', ataque: 'sob ataque', vazia: 'vazia', normal: 'normal', cheio: 'cheio' };
CH.forEach((ch, i) => {
  [ch.w, ch.h] = DIM[ch.tam];
  ch.lista = ch.id === 'deposito' || ch.id === 'lixeira' ? ESTADOS.armazem : ch.id === 'posto' ? ESTADOS.def : ch.cat === 'ext' ? ESTADOS.ext : ch.cat === 'base' ? ESTADOS.base : ESTADOS.prod;
  const m = 0.05; ch.x0 = ch.x + m; ch.x1 = ch.x + ch.w - m; ch.yb = ch.y + ch.h - m;
  const alt = ch.cat === 'def' || ch.cat === 'ext' ? 0.82 : ch.h > 1 ? 0.8 : 1;
  ch.yt = ch.yb - (ch.h - 2 * m) * alt;
  const wall = ch.cat === 'base' ? 0.42 : ch.cat === 'def' ? 0.22 : 0.32;
  ch.yw = ch.yb - (ch.yb - ch.yt) * wall;
  const r = rng(300 + i * 17), p1 = r() * 6.28, p2 = r() * 6.28, a1 = 0.05 + r() * 0.03, a2 = 0.02 + r() * 0.02;
  const cx = (ch.x0 + ch.x1) / 2, rx = (ch.x1 - ch.x0) / 2, ry = ch.yw - ch.yt;
  ch.roof = []; for (let k = 0; k <= 40; k++) { const th = Math.PI + k / 40 * Math.PI; const v = 1 + (a1 * Math.sin(3 * th + p1) + a2 * Math.sin(5 * th + p2)) * Math.sin(k / 40 * Math.PI); ch.roof.push({ x: cx + rx * Math.cos(th), y: ch.yw + ry * v * Math.sin(th) }); }
  const doorY = ch.yb - 0.32;
  ch.door = ch.porta === 'L' ? { x: ch.x0 + 0.05, y: doorY } : ch.porta === 'R' ? { x: ch.x1 - 0.05, y: doorY } : { x: cx, y: ch.yt + 0.05 };
  ch.bob = r() * 6.28;
});
function domePath(ch) { ctx.beginPath(); ctx.moveTo(ch.x0, ch.yb); ctx.lineTo(ch.x0, ch.yw); ch.roof.forEach(q => ctx.lineTo(q.x, q.y)); ctx.lineTo(ch.x1, ch.yb); ctx.closePath(); }

// ---------- rede ----------
const nodes = { E: [9, 0], P: [9, 2.3], A: [9, 3.2], B: [5, 4.4], Cn: [13, 4.4], D: [9, 6.6], Ee: [5.6, 8.4], F: [12.3, 8.4], G: [9, 12.1], L: [3.2, 11.6], S: [13.9, 10.8] };
const N = k => ({ x: nodes[k][0], y: nodes[k][1] });
const doorOf = id => CH.find(c => c.id === id).door;
const lines = [
  [[N('E'), N('P'), N('A')], 2, 'quase'], [[N('A'), N('B')], 1], [[N('A'), N('Cn')], 1], [[N('A'), N('D')], 2],
  [[N('B'), doorOf('jardim')], 1], [[N('Cn'), doorOf('destilaria')], 1], [[N('P'), doorOf('posto')], 1],
  [[N('D'), N('Ee')], 1], [[N('D'), N('F')], 1], [[N('D'), N('G')], 2], [[N('Ee'), doorOf('acida')], 1], [[N('F'), doorOf('presas')], 1],
  [[N('G'), doorOf('real')], 1], [[N('G'), doorOf('bercario')], 1], [[N('G'), doorOf('deposito')], 1],
  [[N('Ee'), N('L'), doorOf('lixeira')], 1], [[N('F'), N('S'), doorOf('coletor')], 1],
];
const segs = [];
lines.forEach(([pts, lvl, st]) => { for (let i = 1; i < pts.length; i++) segs.push({ p: curve(pts[i - 1], pts[i], (R() < .5 ? -1 : 1) * (0.03 + R() * 0.04)), w: lvl === 2 ? T2 : T1, lvl, state: st || 'livre' }); });
const nodeList = Object.keys(nodes).map(N);

// ---------- rotas: cada formiga tem destino (D102: entra, entrega, pega e sai) ----------
const key = p => p.x.toFixed(3) + ',' + p.y.toFixed(3);
const adj = new Map();
segs.forEach(s => {
  const a = key(s.p.pts[0]), b = key(s.p.pts[s.p.pts.length - 1]);
  [[a, b, true], [b, a, false]].forEach(([u, v, fwd]) => { if (!adj.has(u)) adj.set(u, []); adj.get(u).push({ to: v, seg: s, fwd }); });
});
function route(fromP, toP) {
  const A = key(fromP), B = key(toP), prev = new Map([[A, null]]), q = [A];
  while (q.length) { const u = q.shift(); if (u === B) break; (adj.get(u) || []).forEach(e => { if (!prev.has(e.to)) { prev.set(e.to, { u, e }); q.push(e.to); } }); }
  if (!prev.has(B)) return null;
  const steps = []; let c = B; while (prev.get(c)) { const { u, e } = prev.get(c); steps.unshift(e); c = u; }
  return steps;
}
function stepsToPts(steps) {
  const pts = [];
  steps.forEach(({ seg, fwd }) => {
    const src = fwd ? seg.p.pts : seg.p.pts.slice().reverse(), lane = seg.lvl === 2 ? (fwd ? 1 : -1) * seg.w * 0.2 : 0;
    src.forEach((q, i) => { if (pts.length && i === 0) return; pts.push({ x: q.x, y: q.y, lane }); });
  });
  return pts;
}
function mkWalk(pts, speed) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y)); return { type: 'walk', pts, cum, len: cum[cum.length - 1], s: 0, speed }; }
function walkPos(a) {
  const s = Math.min(a.s, a.len); let i = 1; while (i < a.cum.length - 1 && a.cum[i] < s) i++;
  const p = a.pts[i - 1], q = a.pts[i] || p, seg = (a.cum[i] - a.cum[i - 1]) || 1, t = Math.max(0, Math.min(1, (s - a.cum[i - 1]) / seg));
  const ang = Math.atan2(q.y - p.y, q.x - p.x), lane = (p.lane || 0) + ((q.lane || 0) - (p.lane || 0)) * t;
  return { x: p.x + (q.x - p.x) * t - Math.sin(ang) * lane, y: p.y + (q.y - p.y) * t + Math.cos(ang) * lane, ang };
}
const byId = id => CH.find(c => c.id === id);
const floorY = ch => ch.yb - 0.035 - 0.07;
// da porta até o chão: pela lateral desce direto; pelo teto, a formiga anda pelo teto e pela parede
function insideIn(ch) {
  const fy = floorY(ch);
  if (ch.porta === 'T') {
    const mid = Math.floor(ch.roof.length / 2), cx = (ch.x0 + ch.x1) / 2, pts = [{ x: ch.door.x, y: ch.door.y }];
    for (let k = mid; k >= 0; k -= 2) { const q = ch.roof[k]; pts.push({ x: q.x + (cx - q.x) * 0.05, y: q.y + 0.08 }); }
    pts.push({ x: ch.x0 + 0.09, y: ch.yw + 0.05 }, { x: ch.x0 + 0.15, y: fy });
    return pts;
  }
  const inward = ch.porta === 'L' ? 1 : -1;
  return [{ x: ch.door.x, y: ch.door.y }, { x: ch.door.x + inward * 0.25, y: fy }];
}
function accepts(ch, item) {
  const st = ch.estado;
  if (ch.cat === 'prod') {
    const i = ch.ins.indexOf(item); if (i < 0 || ch.inN[i] >= 8) return false;
    if (st === 'falta_ing') return i !== 0;
    return ['produzindo', 'falta_cuid', 'saida_cheia'].includes(st);
  }
  if (ch.id === 'real' || ch.id === 'bercario') return item === 'fungo' && st === 'produzindo';
  if (ch.id === 'deposito') return st === 'normal' && item !== 'refugo';
  if (ch.id === 'lixeira') return st === 'normal' && item === 'refugo';
  return false;
}
const canPick = ch => (ch.cat === 'prod' || ch.cat === 'ext') && ch.outN > 0 && ['produzindo', 'falta_ing', 'falta_cuid'].includes(ch.estado);
function drop(a, ch) { if (ch.cat === 'prod') { const i = ch.ins.indexOf(a.carry); if (i >= 0) ch.inN[i] = Math.min(8, ch.inN[i] + 1); } a.carry = null; }
function pick(a, ch) { if (!canPick(ch)) return; if (ch.id === 'jardim' && Math.random() < 0.25) { a.carry = 'refugo'; return; } ch.outN--; a.carry = ch.out; }
function consumer(item, from) {
  const all = CH.filter(c => c !== from && accepts(c, item)), best = all.filter(c => c.id !== 'deposito');
  const list = best.length ? best : all; return list.length ? list[Math.floor(Math.random() * list.length)] : null;
}
function enter(a, ch) {
  const inPts = insideIn(ch), fy = floorY(ch);

      ctx.fillStyle = alertOf(ch) === 'red' ? '#F2A0A0' : alertOf(ch) ? '#EBD58A' : '#9FD69A'; ctx.fillText(t2, x, y + 21);
    }
  });
  ctx.font = 'bold 10px system-ui,sans-serif';
  tags.forEach(t => { const p = w2s(t.x, t.y); const w = ctx.measureText(t.txt).width + 6; ctx.fillStyle = 'rgba(21,17,14,0.8)'; ctx.fillRect(p.x - w / 2, p.y - 7, w, 14); ctx.fillStyle = C.txt; ctx.fillText(t.txt, p.x, p.y); });
  document.getElementById('lod').textContent = LOD_NOME[lod] + ' · ' + Math.round(z) + ' dp por célula · câmara média 3 × 1 = ' + Math.round(3 * z) + ' × ' + Math.round(z) + ' dp';
}
function toHex(rgb) { if (rgb[0] === '#') return rgb; const m = rgb.match(/\d+/g); return '#' + m.map(v => (+v).toString(16).padStart(2, '0')).join(''); }

// ---------- câmera e gestos ----------
function goTo(x, y, z) { cam.anim = { x0: cam.x, y0: cam.y, z0: cam.z, x1: x, y1: y, z1: z, t0: performance.now(), dur: 450 }; }
function zoomAt(sx, sy, f) { const w = s2w(sx, sy); cam.z *= f; clampCam(); cam.x = w.x - (sx - ux()) / cam.z; cam.y = w.y - (sy - uy()) / cam.z; clampCam(); }
const ptrs = new Map(); let moved = false, lastTap = { t: 0, x: 0, y: 0 };
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); if (ptrs.size === 0) moved = false; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }); cam.anim = null; });
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const ox = p.x, oy = p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    if (Math.hypot(p.x - p.sx, p.y - p.sy) > 8) moved = true;
    if (moved) { cam.x -= (p.x - ox) / cam.z; cam.y -= (p.y - oy) / cam.z; clampCam(); }
  } else if (ptrs.size === 2) {
    moved = true;
    const o = [...ptrs.entries()].find(([k]) => k !== e.pointerId)[1];
    const d0 = Math.hypot(ox - o.x, oy - o.y), d1 = Math.hypot(p.x - o.x, p.y - o.y);
    const m0 = { x: (ox + o.x) / 2, y: (oy + o.y) / 2 }, m1 = { x: (p.x + o.x) / 2, y: (p.y + o.y) / 2 };
    const w = s2w(m0.x, m0.y); if (d0 > 0) cam.z *= d1 / d0; clampCam();
    cam.x = w.x - (m1.x - ux()) / cam.z; cam.y = w.y - (m1.y - uy()) / cam.z; clampCam();
  }
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  const single = ptrs.size === 1; ptrs.delete(e.pointerId);
  if (!single || moved) return;
  const w = s2w(e.clientX, e.clientY), pad = 12 / cam.z;
  const ch = CH.find(c => w.x >= c.x - pad && w.x <= c.x + c.w + pad && w.y >= c.y - pad && w.y <= c.y + c.h + pad);
  if (ch) { ch.estado = ch.lista[(ch.lista.indexOf(ch.estado) + 1) % ch.lista.length]; resetCounts(ch); return; }
  const now = performance.now();
  if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { goTo(w.x, w.y, lodOf(cam.z) === 'perto' ? 30 : 48); lastTap.t = 0; return; }
  lastTap = { t: now, x: e.clientX, y: e.clientY };
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
document.getElementById('zin').onclick = () => goTo(cam.x, cam.y, Math.min(Z_MAX, cam.z * 1.6));
document.getElementById('zout').onclick = () => goTo(cam.x, cam.y, Math.max(zMin(), cam.z / 1.6));
document.getElementById('all').onclick = () => goTo(MW / 2, (MH - SKY) / 2, Math.min(VW / MW, useH() / (MH + SKY)) * 0.98);
document.getElementById('labels').onclick = e => { showLabels = !showLabels; e.target.classList.toggle('on', showLabels); };

window.addEventListener('resize', resize); resize(); cam.z = Math.max(18, VW / MW * 0.98); clampCam();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  updateChambers(dt); ants.forEach(a => updateAnt(a, dt));
  if (cam.anim) { const a = cam.anim, k = Math.min(1, (now - a.t0) / a.dur), e = 1 - Math.pow(1 - k, 3); cam.z = a.z0 + (a.z1 - a.z0) * e; cam.x = a.x0 + (a.x1 - a.x0) * e; cam.y = a.y0 + (a.y1 - a.y0) * e; clampCam(); if (k >= 1) cam.anim = null; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
